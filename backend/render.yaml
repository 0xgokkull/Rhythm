services:
  - type: web
    name: rhythm-zbcx
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: RPC_URL
        value: https://testnet.evm.nodes.onflow.org
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: PROJECT_URL
        sync: false
      - key: SERVICE_ROLE_KEY
        sync: false
